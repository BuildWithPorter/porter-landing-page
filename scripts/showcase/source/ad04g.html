<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="glass.css"><script src="glass.js"></script>
<style>
#sA{position:absolute;left:0;top:0;width:940px;height:1000px;transform-style:preserve-3d}
.stk{width:860px;height:460px;left:40px;transform-origin:50% 50%}
#pA .q{font-family:"EB Garamond";font-size:104px;line-height:1;color:var(--big);padding:60px 56px 0}
#pA .row{display:flex;gap:40px;padding:40px 56px 0}
#pA .un{flex:1;border-top:1px solid var(--hair);padding-top:22px}
#pA .un .v{font-family:"EB Garamond";font-size:110px;line-height:1;color:var(--tx3);margin-top:10px}
#card{left:0;top:30px;width:940px;height:870px}
#card .hdr{display:flex;justify-content:space-between;align-items:baseline;padding:32px 40px 20px}
#card .hdr .ser{font-size:44px;color:var(--big)}
#ask{margin:0 40px;border:1px solid var(--hair);border-radius:12px;padding:22px 26px;font-size:26px;line-height:1.3;min-height:82px;display:flex;align-items:center}
#ask .ph{color:var(--tx2)}
#caret{display:inline-block;width:2.5px;height:30px;background:var(--hi);vertical-align:-6px;margin-left:2px}
.tiles{display:flex;gap:20px;margin:22px 40px 0}
.tile{flex:1;border:1px solid var(--hair);border-radius:12px;padding:22px 26px;opacity:0}
.tile .v{font-family:"EB Garamond";font-size:64px;line-height:1;color:var(--big);margin-top:12px;font-variant-numeric:tabular-nums}
.tile .v b{font-weight:400;color:var(--hi)}
#cb{margin:24px 40px 0;opacity:0}
.leg{display:flex;gap:28px;align-items:center}
.leg i{display:inline-block;width:28px;height:0;border-top:3px solid var(--hi);margin-right:10px;vertical-align:middle}
.leg i.b{border-top:2px dashed var(--line)}
#res{left:100px;top:170px;width:740px;height:auto;padding:54px 60px}
#res .v{font-family:"EB Garamond";font-size:150px;line-height:1;color:var(--big);margin:18px 0 26px;text-shadow:0 0 40px var(--vglow)}
#res .s{font-size:22px;color:var(--tx3);display:flex;justify-content:space-between;border-top:1px solid var(--hair);padding-top:22px}
</style><link rel="stylesheet" href="website.css"></head><body class="t-mono"><div id="stage"><div id="haze"></div>
<script>document.write(GRAIN)</script>
<div class="hd" id="h1" data-k="Without Porter" data-l="Hire two more people?|<em>No CFO to ask.</em>"></div>
<div class="hd" id="h2" data-l="Ask Porter.|It runs the numbers for you."></div>
<div class="hd" id="h3" data-l="+$16K a month.|<em>Cash still grows.</em>"></div>
<div id="viz">
 <div id="sA">
  <div class="glass stk" id="s3" style="top:350px"></div>
  <div class="glass stk" id="s2" style="top:270px"></div>
  <div class="glass stk" id="pA" style="top:190px"><div class="edge"></div>
   <div class="q">Hire 2 PMs?</div>
   <div class="row"><div class="un"><div class="lab">Monthly cost</div><div class="v" id="u1">?</div></div><div class="un"><div class="lab">Cash in a year</div><div class="v" id="u2">?</div></div></div>
  </div>
 </div>
 <div class="glass" id="card"><div class="edge"></div>
  <div class="hdr"><span class="ser">Operating plan</span><span class="lab" id="scn">Base plan</span></div>
  <div id="ask"><div><span id="q"></span><span id="caret"></span></div></div>
  <div class="tiles">
   <div class="tile" id="t1"><div class="lab">Headcount</div><div class="v" id="hc">18</div></div>
   <div class="tile" id="t2"><div class="lab">Monthly cost</div><div class="v" id="pr">+$0</div></div>
  </div>
  <div id="cb"><div class="leg lab"><span><i class="b"></i>Without hires</span><span><i></i>With 2 hires</span></div>
   <svg id="ch" width="860" height="440"></svg></div>
 </div>
 <div class="glass" id="res"><div class="edge"></div><div class="lab">Cash in Aug 2027, with 2 hires</div><div class="v" id="rv">$0</div><div class="s"><span>Every month</span><span>still growing</span></div></div>
</div>
<div id="end"><div class="ln"><span>A CFO at</span></div><div class="ln"><span><em>your fingertips.</em></span></div></div>
<script>document.write(LOGO)</script>
</div>
<script>
// plan data (from ad04): base grows $295,580/mo from $1,145,580; hires cost $16,000/mo
const MON=['Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
const BASE=MON.map((m,i)=>1145580+i*295580),HIRE=MON.map((m,i)=>1145580+i*279580);
const W=860,H=440,PL=74,PR=96,PT=24,PB=44,ymin=800000,ymax=4700000;
const X=i=>PL+i*(W-PL-PR)/11,Y=v=>PT+(1-(v-ymin)/(ymax-ymin))*(H-PT-PB);
const pth=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
let g=`<defs><filter id="g1"><feGaussianBlur stdDeviation="6"/></filter></defs>`;
[1e6,2e6,3e6,4e6].forEach(v=>g+=`<line x1="${PL}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}" class="s-hair"/><text x="${PL-14}" y="${Y(v)+5}" text-anchor="end">$${v/1e6}M</text>`);
MON.forEach((m,i)=>{if(i%2==0||i==11)g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle">${m.toUpperCase()}</text>`});
g+=`<path id="pb" d="${pth(BASE)}" fill="none" class="s-line" stroke-width="2.5" stroke-dasharray="7 7"/><path id="pgl" d="${pth(HIRE)}" fill="none" class="s-glow" stroke-width="8" opacity=".5" filter="url(#g1)"/><path id="ps" d="${pth(HIRE)}" fill="none" class="s-hi" stroke-width="3.5"/>`;
g+=`<g id="eb"><text x="${X(11)+14}" y="${Y(BASE[11])-4}" style="font-size:20px">$4.40M</text></g><g id="es"><circle cx="${X(11)}" cy="${Y(HIRE[11])}" r="7" class="f-hi"/><text x="${X(11)+14}" y="${Y(HIRE[11])+26}" class="f-tx" style="font-size:20px">$4.22M</text></g>`;
$('ch').innerHTML=g;
const Q="What if we hire 2 project managers?";
const T={DUR:20,A:[0.6,5.6],B:[5.8,13.4],q:[6.6,8.6],go:8.9,tiles:9.0,chart:9.6,line:[9.9,11.8],C:[13.6,16.8],end:17.1};
window.DUR=T.DUR;
window.render=function(t){
 renderField(t,t<5.8?1:(t<13.6?.55:1));
 head('h1',0.3,5.6,t);head('h2',5.8,13.4,t);head('h3',13.6,16.8,t);vizScale(t);
 // A: tilted glass stack with the open question
 const sa=$('sA');const ai=out(win(t,T.A[0],1.2)),ao=ease(win(t,T.A[1],.6));sa.style.opacity=ai*(1-ao);
 sa.style.transform=`translateY(${(1-ai)*80}px) rotateX(${34-4*t/6}deg) rotateZ(${-9+2*t/6}deg)`;
 ['s3','s2','pA'].forEach((id,i)=>{const e=$(id);e.style.opacity=out(win(t,T.A[0]+(2-i)*.2,.9))*(i==2?1:.55);e.style.transform=`translateZ(${i*60}px)`});
 ['u1','u2'].forEach((id,i)=>{const k=win(t,2.0+i*.5,.8);$(id).style.opacity=k*(.55+.45*Math.abs(Math.sin((t-2)*1.6+i)))});
 sheen($('pA'),t,2.4);
 // B: plan panel
 const c=$('card');c.dataset.base=`rotateX(${6-3*win(t,T.B[0],6)}deg)`;fade(c,t,T.B[0],T.B[1],70,1.1,.6);
 if(t<T.q[0])$('q').innerHTML='<span class="ph">Ask about any decision</span>';else typeInto($('q'),Q,t,T.q[0],T.q[1]);
 $('caret').style.opacity=(t>T.q[0]-.3&&t<T.go)?(Math.floor(t*2.4)%2?.15:1):0;
 $('scn').textContent=t<T.go?'Base plan':'Hire 2 PMs';
 ['t1','t2'].forEach((id,i)=>{const k=out(win(t,T.tiles+i*.2,.6));$(id).style.opacity=k;$(id).style.transform=`translateY(${(1-k)*18}px)`});
 const k1=out(win(t,T.tiles+.3,1.0));const hc=Math.round(lerp(18,20,k1));$('hc').innerHTML=k1>0?`18 <b>→ ${hc}</b>`:'18';
 $('pr').innerHTML=`<b>+${money(Math.round(lerp(0,16000,k1)/100)*100)}</b>`;
 const cb=out(win(t,T.chart,.6));$('cb').style.opacity=cb;$('cb').style.transform=`translateY(${(1-cb)*18}px)`;
 const L=ease(win(t,T.line[0],T.line[1]-T.line[0]));
 const pb=$('pb');pb.style.opacity=clamp(win(t,T.chart,.6));
 for(const id of ['ps','pgl']){const p=$(id),l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l*(1-L)}
 $('eb').setAttribute('opacity',clamp(win(t,T.chart+.3,.5)));$('es').setAttribute('opacity',clamp((L-.9)*10));
 sheen(c,t,T.line[1]-.2);
 // C: result
 fade($('res'),t,T.C[0],T.C[1],40,1.0,.5);$('rv').textContent='$'+(4.22*out(win(t,T.C[0]+.2,1.4))).toFixed(2)+'M';sheen($('res'),t,T.C[0]+1.2);
 endCard(t,T.end);stageFade(t,T.DUR);
};
ready();
</script><script src="website.js"></script></body></html>
