<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="glass.css"><script src="glass.js"></script>
<style>
#sA{position:absolute;left:0;top:0;width:940px;height:1000px;transform-style:preserve-3d;transform-origin:50% 40%}
#lk{position:absolute;left:0;top:0;overflow:visible}
#dep{left:130px;top:30px;width:680px;height:auto;padding:38px 44px 40px}
#dep .big{font-size:120px;margin-top:16px}
#dep .r{font-size:22px;letter-spacing:.14em;color:var(--tx3);margin-top:18px}
#qm{position:absolute;right:40px;top:34px;font-family:"EB Garamond";font-style:italic;font-size:150px;line-height:1;color:var(--tx2)}
.inv{width:280px;height:auto;padding:28px 30px 30px;transition:none}
.inv .v{font-family:"EB Garamond";font-size:56px;line-height:1;color:var(--big);margin-top:14px}
.pill{display:inline-block;font-family:"DM Sans";font-size:15px;letter-spacing:.2em;text-transform:uppercase;padding:9px 16px;border-radius:8px;border:1px solid var(--hair);color:var(--tx3)}
.inv .pill{margin-top:20px}
.pill.on{background:var(--btnbg);color:var(--btntx);border-color:var(--btnbg)}
#card{left:0;top:40px;width:940px;height:auto}
#card .hdr{display:flex;justify-content:space-between;align-items:flex-end;padding:36px 44px 30px;border-bottom:1px solid var(--hair)}
#card .hdr .ser{font-size:46px;color:var(--big);margin-top:10px}
#card .hdr .big{font-size:76px}
.row{display:grid;grid-template-columns:1fr auto 150px;align-items:center;gap:30px;padding:28px 44px;border-bottom:1px solid var(--hair)}
.row .n{font-size:24px;letter-spacing:.12em;color:var(--tx3)}
.row .v{font-family:"EB Garamond";font-size:48px;color:var(--big);text-align:right}
.row .pill{justify-self:end;font-size:16px;padding:10px 18px}
#tot{display:flex;justify-content:space-between;align-items:baseline;padding:30px 44px 38px}
#tot .v{font-family:"EB Garamond";font-size:72px;color:var(--big);text-shadow:0 0 30px var(--vglow)}

#res{left:120px;top:160px;width:700px;height:auto;padding:54px 60px;text-align:left}
#res .v{font-family:"EB Garamond";font-size:150px;line-height:1;color:var(--big);margin:18px 0 26px;text-shadow:0 0 40px var(--vglow)}
#res .s{font-size:22px;color:var(--tx3);display:flex;justify-content:space-between;border-top:1px solid var(--hair);padding-top:22px}
</style><link rel="stylesheet" href="website.css"></head><body class="t-forest"><div id="stage"><div id="haze"></div>
<script>document.write(GRAIN)</script>
<div class="hd" id="h1" data-k="Without Porter" data-l="A customer paid $14,580.|<em>For which invoices?</em>"></div>
<div class="hd" id="h2" data-l="Porter matches it to|the three invoices it covers."></div>
<div class="hd" id="h3" data-l="Marked paid.|<em>No more digging.</em>"></div>
<div id="viz">
 <div id="sA">
  <svg id="lk" width="940" height="1000"></svg>
  <div class="glass" id="dep"><div class="edge"></div><div class="lab">Deposit · Sep 25</div><div class="big">$14,580</div><div class="r">ACH CUST PMT 0925</div><div id="qm">?</div></div>
  <div class="glass inv" id="i0" style="left:0;top:520px"><div class="edge"></div><div class="lab">INV-1031</div><div class="v">$6,200</div><div class="pill">Open</div></div>
  <div class="glass inv" id="i1" style="left:330px;top:580px"><div class="edge"></div><div class="lab">INV-1034</div><div class="v">$4,915</div><div class="pill">Open</div></div>
  <div class="glass inv" id="i2" style="left:660px;top:520px"><div class="edge"></div><div class="lab">INV-1038</div><div class="v">$3,465</div><div class="pill">Open</div></div>
 </div>
 <div class="glass" id="card"><div class="edge"></div>
  <div class="hdr"><div><div class="lab">Deposit · Sep 25</div><div class="ser">Hartwell Properties</div></div><div class="big">$14,580</div></div>
  <div class="row" id="r0"><span class="n">INV-1031</span><span class="v">$6,200</span><span class="pill" id="s0">Open</span></div>
  <div class="row" id="r1"><span class="n">INV-1034</span><span class="v">$4,915</span><span class="pill" id="s1">Open</span></div>
  <div class="row" id="r2"><span class="n">INV-1038</span><span class="v">$3,465</span><span class="pill" id="s2">Open</span></div>
  <div id="tot"><span class="lab">Matched</span><span class="v" id="tv">$0</span></div></div>
 <div class="glass" id="res"><div class="edge"></div><div class="lab">Paid in full</div><div class="v" id="rv">$0</div><div class="s"><span>3 invoices</span><span>Hartwell Properties</span></div></div>
</div>
<div id="end"><div class="ln"><span>Know who paid,</span></div><div class="ln"><span><em>and for what.</em></span></div></div>
<script>document.write(LOGO)</script>
</div>
<script>
// connector lines: deposit bottom center to each invoice top center
const TO=[[140,520],[470,580],[800,520]];
$('lk').innerHTML=`<defs><filter id="g1"><feGaussianBlur stdDeviation="6"/></filter></defs>`+TO.map(([x,y],i)=>{const d=`M470 330 C 470 ${430}, ${x} ${y-110}, ${x} ${y}`;
 return `<path id="lg${i}" d="${d}" fill="none" class="s-glow" stroke-width="9" opacity=".55" filter="url(#g1)"/><path id="lh${i}" d="${d}" fill="none" class="s-hi" stroke-width="2.5"/><circle id="ld${i}" cx="${x}" cy="${y}" r="7" class="f-hi"/>`}).join('')+`<circle id="l0" cx="470" cy="330" r="8" class="f-hi"/>`;
const AM=[6200,4915,3465];
const T={DUR:20,A:[0.6,8.3],flat:[5.8,6.6],lines:[6.5,8.0],B:[8.5,13.4],rows:9.1,paid:10.7,C:[13.6,16.8],end:17.1};
window.DUR=T.DUR;
window.render=function(t){
 renderField(t,t<5.8?1:(t<13.6?.55:1));
 head('h1',0.3,5.6,t);head('h2',5.8,13.4,t);head('h3',13.6,16.8,t);vizScale(t);
 // A: tilted deposit + scattered invoices, then flatten and connect
 const sa=$('sA'),ai=out(win(t,T.A[0],1.2)),ao=ease(win(t,T.A[1],.6)),fl=ease(win(t,T.flat[0],T.flat[1]-T.flat[0]));
 sa.style.opacity=ai*(1-ao);sa.style.filter=`blur(${ao*8}px)`;
 sa.style.transform=`translateY(${(1-ai)*80-ao*30}px) rotateX(${(22-3*t/6)*(1-fl)}deg) rotateZ(${(-6+1.5*t/6)*(1-fl)}deg)`;
 const d=$('dep');d.style.opacity=out(win(t,T.A[0],.9));d.style.transform=`translateZ(${60*(1-fl)}px)`;
 const q=$('qm');q.style.opacity=out(win(t,1.8,.6))*(1-ease(win(t,T.lines[0],.5)))*(.7+.3*Math.sin(t*3));
 [0,1,2].forEach(i=>{const e=$('i'+i),k=out(win(t,1.4+i*.3,.9)),bob=Math.sin(t*1.3+i*2.1)*10*(1-fl);
  e.style.opacity=k;e.style.filter=`blur(${(1-k)*10}px)`;
  e.style.transform=`translateY(${(1-k)*40+bob}px) translateZ(${[-40,20,-80][i]*(1-fl)}px) rotateZ(${[-4,3,5][i]*(1-fl)}deg)`;
  const lk=ease(win(t,T.lines[0]+i*.25,.9));
  for(const id of ['lh','lg']){const p=$(id+i),l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l*(1-lk)}
  const hit=clamp((lk-.9)*10);$('ld'+i).setAttribute('opacity',hit);
  e.style.boxShadow=hit>0?`0 0 ${60*hit}px var(--vglow), var(--g-sh)`:'';sheen(e,t,T.lines[0]+i*.25+.8)});
 $('l0').setAttribute('opacity',out(win(t,T.lines[0],.3)));
 sheen(d,t,2.4);
 // B: matched panel
 const c=$('card');c.dataset.base=`rotateX(${5-3*win(t,T.B[0],5)}deg)`;fade(c,t,T.B[0],T.B[1],70,1.1,.6);
 let sum=0;AM.forEach((v,i)=>{const a=T.rows+i*.4,k=out(win(t,a,.7)),r=$('r'+i);r.style.opacity=k;r.style.transform=`translateY(${(1-k)*20}px)`;r.style.filter=`blur(${(1-k)*6}px)`;
  const pa=T.paid+i*.45;sum+=v*out(win(t,pa-.1,.7));const s=$('s'+i),pd=t>=pa;s.textContent=pd?'Paid':'Open';s.classList.toggle('on',pd);
  s.style.transform=`scale(${pd?1+.12*Math.sin(Math.PI*win(t,pa,.3)):1})`});
 $('tv').textContent=money(sum);sheen(c,t,T.paid+1.3);
 // C: result
 fade($('res'),t,T.C[0],T.C[1],40,1.0,.5);$('rv').textContent=money(14580*out(win(t,T.C[0]+.2,1.0)));sheen($('res'),t,T.C[0]+1.2);
 endCard(t,T.end);stageFade(t,T.DUR);
};
ready();
</script><script src="website.js"></script></body></html>
