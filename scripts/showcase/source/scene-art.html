<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="glass.css"><script src="glass.js"></script><style>
body.t-mono{--base:#101211;--bg:radial-gradient(ellipse at 55% 48%,#202723,#101211 74%);--hazec:rgba(149,212,179,.025)}
#objects{position:absolute;inset:0;perspective:2200px}.paper{padding:34px;border-radius:0;transform:rotateY(-7deg) rotateX(10deg) rotateZ(-4deg)}.paper h2{font:400 43px/1.08 'EB Garamond';margin:16px 0 24px}.lab{font-size:15px;color:var(--tx3)}.amount{font:400 78px/1 'EB Garamond';margin:20px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid var(--hair);padding:17px 0;font-size:23px}.line:last-child{border:0}.good{color:var(--hi)}.tag{font:400 17px 'DM Sans';letter-spacing:.1em;text-transform:uppercase}.ribbon{padding:24px 32px;border-radius:0;font-size:25px;transform:rotateZ(-2deg)}.dark{--g-bg:linear-gradient(135deg,rgba(36,48,41,.96),rgba(14,20,16,.96));--tx:#F4F1EA;--tx3:#BFC9C1;--hair:rgba(191,201,193,.2);--hi:#95D4B3;--g-bd:rgba(191,201,193,.3);color:var(--tx)}
.connections{position:absolute;inset:0;width:1440px;height:1080px}.connections path,.connections line{fill:none;stroke:#95D4B3;stroke-width:2;opacity:.5}.connections circle{fill:#95D4B3}.small{font-size:20px;color:var(--tx3);line-height:1.5}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:30px}.day{font-size:25px;min-height:54px;padding:10px;text-align:center}.day.paid{background:var(--fill);color:var(--hi);outline:1px solid var(--hi)}.tile{padding:22px;border-radius:0;text-align:center}.tile .amount{font-size:49px}.bar{height:35px;background:var(--fill);margin:18px 0;position:relative}.bar i{display:block;height:100%;background:var(--hi);opacity:.7}.receipt{width:340px;height:420px;padding:34px;clip-path:polygon(0 0,100% 0,100% 96%,95% 100%,90% 96%,85% 100%,80% 96%,75% 100%,70% 96%,65% 100%,60% 96%,55% 100%,50% 96%,45% 100%,40% 96%,35% 100%,30% 96%,25% 100%,20% 96%,15% 100%,10% 96%,5% 100%,0 96%)}.stamp{border:2px solid var(--hi);padding:14px;font:400 22px 'DM Sans';text-align:center;color:var(--hi);transform:rotate(-8deg);margin-top:28px}.ghost{opacity:.5}.missing{border:2px dashed var(--tx3);padding:28px;margin-top:34px;text-align:center;color:var(--tx3);font-size:24px}.dots{display:flex;gap:14px;margin-top:30px}.dots b{width:20px;height:20px;border-radius:50%;background:var(--hi);opacity:.7}
</style></head><body class="t-mono"><div id="stage"><div id="haze"></div><div id="objects"></div></div><script>

const links=paths=>`<svg class="connections" viewBox="0 0 1440 1080">${paths.map(d=>`<path d="${d}"/>`).join('')}</svg>`;

 links(['M590 410L760 410','M590 610L760 610'])+P(160,240,460,H('Bank activity','Every movement, matched.')+R('Customer payment','$12,480')+R('Vendor payment','−$4,800')+R('Payroll','−$18,250'))+P(780,300,440,H('General ledger','A clear record.')+R('Receivables','✓ Matched')+R('Payables','✓ Matched')+R('Payroll','✓ Matched'),'','transform:rotateZ(4deg)')+ribbon(480,750,550,'Reconciled books → month-end reports'),
 links(['M470 440C700 440 660 680 800 680'])+P(210,220,450,H('Invoice · Alder Creek','Work becomes revenue.')+'<div class="amount">$18,400</div>'+R('Completed job','Invoice sent')+'<div class="stamp">SENT</div>')+P(830,470,350,H('Bank match','Payment received.')+'<div class="amount">$18,400</div><div class="good tag">✓ Matched to invoice</div>','dark','transform:rotateZ(5deg)')+ribbon(460,810,540,'Invoice → follow-up → payment'),
 P(220,190,710,H('Payment calendar','The right payment. The right day.')+'<div class="calendar">'+Array.from({length:28},(_,i)=>`<div class="day ${[7,13,20].includes(i)?'paid':''}">${i+1}</div>`).join('')+'</div>')+P(890,310,330,H('To approve','Materials supply')+'<div class="amount">$4,800</div>'+R('Due','14 Aug'),'dark','transform:rotateZ(7deg)')+ribbon(770,720,460,'Approval stays with you.'),
 links(['M720 400V530M390 650V530H1050V650','M720 530V650'])+P(470,170,500,H('Payroll · 28 August','One payday. Everyone aligned.')+'<div class="dots"><b></b><b></b><b></b><b></b><b></b></div>')+[260,565,870].map((x,i)=>P(x,600,290,H(['Pay','Withholding','Books'][i],['Your people','Payroll taxes','Payroll journal'][i])+`<div class="good tag">${['Prepared','Recorded','Connected'][i]}</div>`,i===1?'dark':'','transform:rotateZ('+([-5,0,5][i])+'deg)')).join(''),
 P(250,330,490,H('Supporting records','The details, organized.')+R('Year-end books','✓')+R('Payroll records','✓')+R('Supporting schedules','✓'),'','transform:rotateZ(-12deg)')+P(650,200,470,H('Tax preparation','Ready for filing.')+'<div class="small">Books and supporting records<br>connected to the filing process.</div><div class="stamp">PREPARATION → REVIEW</div>','','transform:rotateZ(6deg);min-height:490px')+ribbon(510,780,570,'A coordinated process, before the deadline.'),
 P(180,200,950,H('Financial planning','One decision. Different futures.')+chart+R('Solid: operating plan','Dashed: hiring scenario'))+P(955,670,310,H('What if?','Two new hires')+'<div class="small">Explore the impact<br>before you commit.</div>','dark','transform:rotateZ(6deg)')

const challenges=[
 P(330,240,660,H('Your current reports','The totals are there.')+R('Revenue','$148,000')+R('Operating expenses','$121,000')+'<div class="missing">But what changed — and why?</div>','','transform:rotateZ(-6deg)')+P(870,650,300,'<div class="amount">?</div><div class="small">Still waiting<br>for an explanation.</div>','dark','transform:rotateZ(7deg)'),
 P(170,240,540,H('Email · last month','What was this payment for?')+'<div class="small">You already explained it.</div>','','transform:rotateZ(-8deg)')+P(600,445,530,H('Message · this month','Can you remind us?')+'<div class="small">The same context. Again.</div>','dark','transform:rotateZ(5deg)')+P(380,725,570,H('Your time','Back to the same conversation.'),'','transform:rotateZ(-3deg)'),
 P(190,210,560,H('Job completed','Alder Creek Deck')+'<div class="amount">$18,400</div><div class="tag good">Work delivered</div>','','transform:rotateZ(-7deg)')+P(760,400,460,H('Still missing','The invoice.')+'<div class="missing">Not sent</div>','','transform:rotateZ(6deg)')+ribbon(460,780,540,'Work done. Cash still outstanding.'),
 [P(160,220,420,H('Accounting','The books.')+R('Transactions','↗'),'','transform:rotateZ(-9deg)'),P(810,260,400,H('Spreadsheets','The group view.')+R('Manual roll-up','…'),'','transform:rotateZ(8deg)'),P(210,650,430,H('Inbox','The context.')+R('Messages','↗'),'dark','transform:rotateZ(5deg)'),P(790,660,450,H('Payments','The cash.')+R('Separate records','…'),'dark','transform:rotateZ(-5deg)')].join('')
];
const mode=new URLSearchParams(location.search).get('mode')||'service';const n=+(new URLSearchParams(location.search).get('n')||0);$('objects').innerHTML=(mode==='challenge'?challenges:services)[n];window.render=t=>renderField(t,.5);ready();
</script></body></html>
